name: Deploy PosCloud
on:
  push:
    branches: [main]
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            agent:
              - 'agent/**'
  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: https://poscloud.uz
        run: npm run build
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        working-directory: backend
        run: dotnet restore src/PosCloud.Api
      - name: Publish backend
        working-directory: backend
        run: dotnet publish src/PosCloud.Api -c Release -o ./publish
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: backend/publish
          retention-days: 1
  build-agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish agent (Windows self-contained)
        working-directory: agent/PosCloud.Agent
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o ./publish
      - name: Inject Agent API key (GitHub secret)
        working-directory: agent/PosCloud.Agent/publish
        env:
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
        run: |
          if [ -z "$AGENT_API_KEY" ]; then
            echo "::warning::AGENT_API_KEY secret bo'sh — agent 401 oladi. GitHub repo Settings > Secrets ga AGENT_API_KEY qo'shing (server bilan bir xil)."
          fi
          tmp=$(mktemp)
          jq --arg k "$AGENT_API_KEY" '.Agent.ApiKey = $k' appsettings.json > "$tmp" && mv "$tmp" appsettings.json
          echo "ApiKey o'rnatildi (uzunlik: ${#AGENT_API_KEY})"
      - name: Zip agent
        working-directory: agent/PosCloud.Agent
        run: cd publish && zip -qr ../PosCloud-Agent.zip .
      - name: Upload agent build
        uses: actions/upload-artifact@v4
        with:
          name: PosCloud-Agent
          path: agent/PosCloud.Agent/PosCloud-Agent.zip
          retention-days: 30
  deploy:
    needs: [changes, build-frontend, build-backend]
    if: always() && (needs.build-frontend.result == 'success' || needs.build-backend.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts
      - name: Download frontend artifact
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist
      - name: Download backend artifact
        if: needs.changes.outputs.backend == 'true'
        uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: backend-publish
      - name: Deploy backend (and merge frontend if changed)
        if: needs.changes.outputs.backend == 'true'
        run: |
          EXTRA_EXCLUDE=""
          if [ -d frontend-dist ]; then
            mkdir -p backend-publish/wwwroot
            rm -rf backend-publish/wwwroot/*
            cp -r frontend-dist/* backend-publish/wwwroot/
          else
            # Frontend o'zgarmagan — serverdagi wwwroot'ga tegmaymiz
            EXTRA_EXCLUDE="--exclude wwwroot"
          fi
          rsync -az --delete --exclude 'wwwroot/uploads' --exclude 'updates' $EXTRA_EXCLUDE \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            backend-publish/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/posplatform/
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "UNIT=\$(systemctl show -p FragmentPath --value posplatform) && sudo sed -i 's#PosPlatform\.Api\.dll#PosCloud.Api.dll#' \"\$UNIT\" && sudo systemctl daemon-reload && sudo mkdir -p /opt/posplatform/wwwroot/uploads && sudo chown -R posplatform:posplatform /opt/posplatform && sudo systemctl restart posplatform && sleep 2 && sudo systemctl status posplatform --no-pager"
      - name: Deploy frontend only (backend unchanged)
        if: needs.changes.outputs.backend == 'false' && needs.changes.outputs.frontend == 'true'
        run: |
          rsync -az --delete --exclude 'uploads' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            frontend-dist/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/posplatform/wwwroot/
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "sudo mkdir -p /opt/posplatform/wwwroot/uploads && sudo chown -R posplatform:posplatform /opt/posplatform/wwwroot && sudo systemctl restart posplatform"
      - name: Health check
        run: |
          sleep 3
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://poscloud.uz/ || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::Sayt 200 qaytarmadi — deploy'dan keyin tekshiring"
          exit 1
