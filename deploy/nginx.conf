# PosCloud — nginx reverse proxy (HTTPS terminatsiyasi).
# nginx 443 (TLS) ni qabul qiladi va ichki ASP.NET ilovasiga (http://127.0.0.1:5000) uzatadi.
# Ilova FAQAT localhost'ga bog'lanishi kerak (tashqaridan to'g'ridan-to'g'ri ochiq bo'lmasin),
# shunda X-Forwarded-* header'lariga ishonish xavfsiz bo'ladi.

# HTTP -> HTTPS yo'naltirish
server {
    listen 80;
    server_name poscloud.uz www.poscloud.uz;
    return 301 https://poscloud.uz$request_uri;
}

# www -> apex (poscloud.uz) yo'naltirish
server {
    listen 443 ssl http2;
    server_name www.poscloud.uz;
    ssl_certificate     /etc/letsencrypt/live/poscloud.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poscloud.uz/privkey.pem;
    return 301 https://poscloud.uz$request_uri;
}

server {
    listen 443 ssl http2;
    server_name poscloud.uz;

    # TLS sertifikat (masalan Let's Encrypt / certbot)
    ssl_certificate     /etc/letsencrypt/live/poscloud.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poscloud.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS — brauzerga doim HTTPS ishlatishni buyuradi
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Excel import / rasm yuklash uchun yetarli hajm
    client_max_body_size 25m;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Original so'rov ma'lumotlari (ilova ForwardedHeaders bilan o'qiydi)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / uzoq so'rovlar uchun
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
